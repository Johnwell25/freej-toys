<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>FreeJ Toys – Stock & Prices</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1e;--muted:#6b6b70;--line:#e4e2dd;--accent:#d6452f;--ok:#1f8a4c;--warn:#c9761b;--bad:#c0392b;--blue:#1f5fa8;--soft:#efede8}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f2;--muted:#9a9aa0;--line:#2e2e33;--soft:#26262a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{padding:24px 20px 8px;max-width:1240px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.03)}
.bar>div{max-width:1240px;margin:auto;padding:10px 20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:200px}
.lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.tog button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tog button{border:0;border-radius:0}
.tog button.on{background:var(--accent);color:#fff}
.reset{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline}
.filters>div{max-width:1240px;margin:auto;padding:10px 20px 0;display:flex;flex-direction:column;gap:8px}
@media (max-width:700px){.bar select{flex:1 1 40%;min-width:0;font-size:13px;padding:8px}.grid{grid-template-columns:repeat(2,1fr)!important;gap:10px!important}input[type=search]{flex-basis:100%}.price{flex-direction:column;align-items:flex-start;gap:0}.price b,.price span{white-space:nowrap}.price b{font-size:16px}.name{font-size:13px}.stats{grid-template-columns:repeat(2,1fr)}.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;max-width:calc(100vw - 80px)}.row>.lbl{min-width:44px}.filters .row{flex-wrap:nowrap}.filters .row:last-child{flex-wrap:wrap}}
.count{font-size:13px;color:var(--muted);margin-left:auto}
main{max-width:1240px;margin:auto;padding:14px 20px 40px}
.grp{font-weight:700;font-size:16px;margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.grp:after{content:'';flex:1;height:1px;background:var(--line)}
.grp small{color:var(--muted);font-weight:500;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;position:relative}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.none{color:var(--muted);font-size:12px;background:var(--soft)}
.qb{position:absolute;right:8px;top:8px;background:rgba(28,28,30,.85);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.qb.short{background:var(--warn)}
.bx{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.92);color:#1c1c1e;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid #ddd}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:14px;line-height:1.3}
.meta{color:var(--muted);font-size:12px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.price b{font-size:19px;font-variant-numeric:tabular-nums}
.price s,.price span{font-size:12px;color:var(--muted)}
.price span.q{color:var(--warn);font-weight:600}
.mk{font-size:11.5px;color:var(--muted)}
.mk a{color:var(--blue)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.Complete{color:#fff;background:var(--ok);border-color:var(--ok)}
.tag.Partly{color:#fff;background:var(--warn);border-color:var(--warn)}
.tag.ex{color:var(--blue);border-color:var(--blue)}
.tag.ch{color:#fff;background:#7b3fb5;border-color:#7b3fb5}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--soft);font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
tr:hover td{background:var(--soft)}
.tbl{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 30px}
@media print{.bar{position:static}.card{break-inside:avoid}}
</style>
</head>

function pass(d){
  if(S.kind!=='All'&&d.kind!==S.kind)return false;
  if(S.ser!=='All'&&d.ser!==S.ser)return false;
  const p=price(d)||0;
  switch(S.flag){
    case 'Exclusives':if(!d.excl)return false;break;
    case 'Chase':if(!d.chase)return false;break;
    case 'Checked':if(!d.cond)return false;break;
    case 'Not checked':if(d.cond)return false;break;
    case 'Has photo':if(!d.img)return false;break;
    case 'Under AED 100':if(!(p&&p<100))return false;break;
    case 'AED 100–300':if(!(p>=100&&p<=300))return false;break;
    case 'Over AED 300':if(!(p>300))return false;break;
  }
  if(S.q){const t=S.q.toLowerCase().replace(/^#/,'');if(!(d.name+' '+d.code+' '+d.box+' '+d.ser).toLowerCase().includes(t))return false}
  return true;
}
function sorter(a,b){
  switch(S.sort){
    case 'name':return a.name.localeCompare(b.name);
    case 'phi':return (price(b)||0)-(price(a)||0);
    case 'plo':return (price(a)||1e9)-(price(b)||1e9);
    case 'qty':return b.qty-a.qty;
    case 'val':return (price(b)||0)*b.qty-(price(a)||0)*a.qty;
    default:return boxn(a)-boxn(b)||a.name.localeCompare(b.name);
  }
}
function band(d){const p=price(d);if(p==null)return 'Price on request';if(p<100)return 'Under AED 100';if(p<=300)return 'AED 100–300';if(p<=700)return 'AED 300–700';return 'Over AED 700'}
const BAND_ORDER=['Under AED 100','AED 100–300','AED 300–700','Over AED 700','Price on request'];
function card(d){
  const p=price(d),alt=S.pm==='rec'?d.quick:d.rec;
  const ph=d.img?`<img loading="lazy" src="${esc(d.img)}" alt="${esc(d.name)}">`:'No photo yet';
  const mk=d.mk&&d.mk.same?`<div class="mk">Market: <a href="${esc(d.mk.u)}" target="_blank" rel="noopener">${esc(d.mk.s)}</a>${d.mk.p?' · AED '+Math.round(d.mk.p):''}</div>`:'';
  return `<div class="card">
   <div class="ph ${d.img?'':'none'}">${ph}${d.box?`<span class="bx">#${esc(d.box)}</span>`:''}<span class="qb ${isShort(d)?'short':''}">×${d.qty}</span></div>
   <div class="body">
     <div class="name">${esc(d.name)}</div>
     <div class="meta">${esc(d.code)} · ${esc(d.ser)}</div>
     <div class="price"><b>${fmt(p)}</b>${alt!=null?`<span class="${S.pm==='rec'?'q':''}">${S.pm==='rec'?'Quick':'Rec.'} ${fmt(alt)}</span>`:''}</div>
     ${mk}
     <div class="tags">${d.cond?`<span class="tag ${d.cond}">${d.cond==='Partly'?'Partly damaged':d.cond}</span>`:'<span class="tag">Not checked</span>'}${d.chase?'<span class="tag ch">Chase</span>':d.excl?'<span class="tag ex">Exclusive</span>':''}<span class="tag">${esc(d.kind)}</span></div>
   </div></div>`;
}
function table(list){
  return `<div class="tbl"><table><thead><tr><th></th><th data-s="box">Box</th><th data-s="name">Item</th><th>Series</th><th>Type</th><th data-s="qty">Qty</th><th data-s="phi">Recommended</th><th>Quick sale</th><th>Market</th><th>Status</th></tr></thead><tbody>${
   list.map(d=>`<tr><td>${d.img?`<img loading="lazy" src="${esc(d.img)}" alt="">`:''}</td><td>${esc(d.box||'—')}</td><td><b>${esc(d.name)}</b><div class="meta">${esc(d.code)}</div></td><td>${esc(d.ser)}</td><td>${esc(d.kind)}${d.chase?' · Chase':d.excl?' · Excl.':''}</td><td class="n">${d.qty}</td><td class="n"><b>${fmt(d.rec)}</b></td><td class="n">${fmt(d.quick)}</td><td>${d.mk&&d.mk.same?`<a href="${esc(d.mk.u)}" target="_blank" rel="noopener">${esc(d.mk.s)}</a>`:'—'}</td><td>${d.cond?(d.cond==='Partly'?'Partly damaged':d.cond):'Not checked'}</td></tr>`).join('')
  }</tbody></table></div>`;
}
function stats(list){
  const u=list.reduce((a,d)=>a+d.qty,0),vr=list.reduce((a,d)=>a+(d.rec||0)*d.qty,0),vq=list.reduce((a,d)=>a+(d.quick||0)*d.qty,0);
  document.getElementById('stats').innerHTML=[
   [list.length,'Items'],[u.toLocaleString('en-US'),'Units in stock'],[fmt(vr),'Value at recommended'],[fmt(vq),'Value at quick sale'],[list.filter(d=>d.cond).length,'Condition checked']]
   .map(([b,s])=>`<div class="stat"><b>${b}</b><small>${s}</small></div>`).join('');
}
function render(){
  chips('kinds',KINDS,()=>S.kind,v=>S.kind=v);
  chips('sers',['All',...SER_ORDER.filter(s=>DATA.some(d=>d.ser===s))],()=>S.ser,v=>S.ser=v);
  chips('flags',FLAGS,()=>S.flag,v=>S.flag=v);
  const list=DATA.filter(pass).sort(sorter);
  stats(list);
  document.getElementById('count').textContent=`${list.length} of ${DATA.length} items`;
  const out=document.getElementById('out');
  if(!list.length){out.innerHTML='<div class="empty">No items match. <button class="reset" onclick="clearAll()">Clear filters</button></div>';return}
  if(S.view==='list'){out.innerHTML=table(list);out.querySelectorAll('th[data-s]').forEach(th=>th.onclick=()=>{S.sort=th.dataset.s;document.getElementById('sort').value=S.sort;render()});return}
  if(S.group==='none'){out.innerHTML=`<div class="grid">${list.map(card).join('')}</div>`;return}
  const key=S.group==='ser'?(d=>d.ser):S.group==='kind'?(d=>d.kind):band;
  const order=S.group==='ser'?SER_ORDER:S.group==='kind'?KINDS.slice(1):BAND_ORDER;
  out.innerHTML=order.map(g=>{const l=list.filter(d=>key(d)===g);if(!l.length)return '';
    const u=l.reduce((a,d)=>a+d.qty,0);
    return `<div class="grp">${esc(g)} <small>${l.length} items · ${u} units</small></div><div class="grid">${l.map(card).join('')}</div>`}).join('');
}
function clearAll(){Object.assign(S,{q:'',kind:'All',ser:'All',flag:'All'});document.getElementById('q').value='';render()}
document.getElementById('q').addEventListener('input',e=>{S.q=e.target.value.trim();render()});
document.getElementById('sort').onchange=e=>{S.sort=e.target.value;render()};
document.getElementById('group').onchange=e=>{S.group=e.target.value;render()};
document.getElementById('reset').onclick=clearAll;
tog('pmode','pm');tog('view','view');
document.getElementById('asof').textContent=ASOF;
render();
</script>
</body>
</html>
