<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1e;--muted:#6b6b70;--line:#e4e2dd;--accent:#d6452f;--ok:#1f8a4c;--warn:#c9761b;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f2;--muted:#9a9aa0;--line:#2e2e33}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:28px 20px 12px;max-width:1200px;margin:auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar>div{max-width:1200px;margin:auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{flex:1;min-width:200px;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips button{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1200px;margin:auto;padding:16px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.none{color:var(--muted);font-size:12px;background:var(--line)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:14px}
.meta{color:var(--muted);font-size:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.Complete{color:#fff;background:var(--ok);border-color:var(--ok)}
.tag.Partly{color:#fff;background:var(--warn);border-color:var(--warn)}
.tag.Damaged,.tag.Missing{color:#fff;background:var(--bad);border-color:var(--bad)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 30px}
</style>
</head>

K statue – Makima (blood-splattered) with 2 swappable upper bodies, crosses and crows on graveyard base", "box": "", "qty": 1, "img": "FJ-GK-013.jpg", "cond": "Complete", "kind": "Statue"}];
const ASOF="21 Nov 2026";
let kind='All',cond='All',q='';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stats(){
  const units=DATA.reduce((a,d)=>a+d.qty,0),checked=DATA.filter(d=>d.cond).length;
  const st=[['Items',DATA.length],['Units in stock',units.toLocaleString()],['Statues',DATA.filter(d=>d.kind==='Statue').length],['Condition checked',checked+' / '+DATA.length]];
  document.getElementById('stats').innerHTML=st.map(([l,v])=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`).join('');
}
function chips(id,opts,get,set){
  const el=document.getElementById(id);
  el.innerHTML=opts.map(o=>`<button data-v="${o}" class="${get()===o?'on':''}">${o}</button>`).join('');
  el.onclick=e=>{const v=e.target.dataset.v;if(!v)return;set(v);render()};
}
function card(d){
  const ph=d.img?`<div class="ph"><img loading="lazy" src="${d.img}" alt="${esc(d.name)}"></div>`:`<div class="ph none">No photo</div>`;
  const ck=d.cond?`<span class="tag ${d.cond.split(' ')[0]}">${esc(d.cond)}</span>`:`<span class="tag">Not checked yet</span>`;
  return `<div class="card">${ph}<div class="body"><div class="name">${esc(d.name)}</div>
  <div class="meta">${esc(d.code)}${d.box?' · #'+esc(d.box):''} · Qty ${d.qty}</div>
  <div class="tags"><span class="tag">${d.kind}</span>${ck}</div></div></div>`;
}
function render(){
  chips('kinds',['All','Pop','Statue','Keychain','Mini'],()=>kind,v=>kind=v);
  chips('conds',['Checked','Not checked'],()=>cond,v=>cond=(cond===v?'All':v));
  const s=q.toLowerCase();
  const list=DATA.filter(d=>(kind==='All'||d.kind===kind)&&(cond==='All'||(cond==='Checked')===!!d.cond)&&(!s||(d.name+' '+d.code+' '+d.box).toLowerCase().includes(s)));
  document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No items match.</div>';
}
document.getElementById('q').oninput=e=>{q=e.target.value;render()};
document.getElementById('asof').textContent=ASOF;
stats();render();
</script>
